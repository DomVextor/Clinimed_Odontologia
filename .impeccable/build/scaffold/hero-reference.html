<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: assigned-pavilion.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaina+2:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f5f5f3}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1672px">
  <figure class="r-hero-background region plate" data-region="hero-background"><img src="../../../assets/plates/hero-background.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-nav-shell region chrome" data-region="nav-shell"><!-- single floating translucent white glass navigation bubble --></div>
  <figure class="r-nav-brand region plate" data-region="nav-brand"><img src="../../../assets/plates/nav-brand.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-nav-links region text" data-region="nav-links"><!-- desktop navigation labels from Início through Contatos in one horizontal row --><p style="font-size:var(--r-nav-links-font);line-height:1.05;margin:0">nav-links</p></div>
  <div class="r-nav-cta region control" data-region="nav-cta"><!-- deep-green rounded WhatsApp control labeled Agende sua avaliação: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-cta); a control need not have button chrome --></div>
  <div class="r-hero-title region text" data-region="hero-title"><!-- large two-line dark-green headline Seu sorriso, cuidado por inteiro --><p style="font-size:var(--r-hero-title-font);font-family:var(--r-hero-title-family),sans-serif;font-weight:var(--r-hero-title-weight);line-height:1.05;margin:0">hero-title</p></div>
  <div class="r-hero-summary region text" data-region="hero-summary"><!-- two-line charcoal summary about a multidisciplinary clinic with more than 40 procedures --><p style="font-size:var(--r-hero-summary-font);line-height:1.05;margin:0">hero-summary</p></div>
  <div class="r-hero-cta region control" data-region="hero-cta"><!-- large deep-green rounded WhatsApp control labeled Agendar pelo WhatsApp: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop hero-cta); a control need not have button chrome --></div>
  <div class="r-proof-since region text" data-region="proof-since"><!-- calendar icon with Desde 2010 and short supporting copy --><p style="font-size:var(--r-proof-since-font);line-height:1.05;margin:0">proof-since</p></div>
  <div class="r-proof-place region text" data-region="proof-place"><!-- location icon with Votuporanga SP and short supporting copy --><p style="font-size:var(--r-proof-place-font);line-height:1.05;margin:0">proof-place</p></div>
  <div class="r-proof-human region text" data-region="proof-human"><!-- heart icon with Atendimento humanizado and short supporting copy --><p style="font-size:var(--r-proof-human-font);line-height:1.05;margin:0">proof-human</p></div>
  <div class="r-section-shell region chrome" data-region="section-shell"><!-- wide off-white next-section surface with one smooth rising curved upper edge and a slim green-lime rule --></div>
  <div class="r-section-label region text" data-region="section-label"><!-- small tracked green label Nossos tratamentos --><p style="font-size:var(--r-section-label-font);line-height:1.05;margin:0">section-label</p></div>
  <div class="r-section-title region text" data-region="section-title"><!-- large two-line dark-green heading Cuidado completo, no seu tempo --><p style="font-size:var(--r-section-title-font);line-height:1.05;margin:0">section-title</p></div>
  <div class="r-section-copy region text" data-region="section-copy"><!-- short charcoal paragraph about integrated planning and care --><p style="font-size:var(--r-section-copy-font);line-height:1.05;margin:0">section-copy</p></div>
  <div class="r-benefit-team region control" data-region="benefit-team"><!-- quiet benefit item with people icon and Equipe especializada: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop benefit-team); a control need not have button chrome --></div>
  <div class="r-benefit-plan region control" data-region="benefit-plan"><!-- quiet benefit item with planning icon and Planejamento integrado: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop benefit-plan); a control need not have button chrome --></div>
  <div class="r-benefit-time region control" data-region="benefit-time"><!-- quiet benefit item with clock icon and Mais praticidade para sua rotina: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop benefit-time); a control need not have button chrome --></div>
  <div class="r-benefit-results region control" data-region="benefit-results"><!-- quiet benefit item with care icon and Resultados que acompanham você: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop benefit-results); a control need not have button chrome --></div>
  <figure class="r-patient-image region plate" data-region="patient-image"><img src="../../../assets/plates/patient-image.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
</main>
</body>
</html>
